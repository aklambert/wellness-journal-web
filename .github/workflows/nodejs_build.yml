name: Nodejs Build CI

# Trigger this CI on push, and pull requests for main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout
       uses: actions/checkout@v3

     - name: Set up Node.js
       uses: actions/setup-node@v3
       with:
        node-version: '22.2.0'

     - name: Install dependencies
       run: npm Install

     - name: Run Tests
       run: npm test
